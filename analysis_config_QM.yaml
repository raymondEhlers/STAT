# Configuration for STAT analysis
debug_level: 0

# Specify model
models:
  MATTER_LBT_QM_exponential:
    input_dir: "/rstorage/jetscape/STAT-Bayesian/Analysis1/tables"
    # Follows the order that they are stored in the design points file
    parameter_names: ["$\\alpha_S^{\\rm{fix}}$", "$Q_0$", "$c_1$", "$c_2$", "$\\tau_0$", "$c_3$"]
    min: [0.1, 1, 0.006737946999085467, 0.006737946999085467, 0, 0.049787068367863944]
    max: [0.5, 10, 10, 10, 1.5, 100]
    alpha: 0.3

# Design parameters
generate_design: False
n_points_per_dimension: 10

# Emulator parameters
retrain_emulator: True
n_pc: 3
n_restarts: 50

# MCMC parameters
rerun_mcmc: False
n_walkers: 500
n_burn_steps: 1000
n_steps: 500

# Closure test parameters
confidence: [0.9, 0.6]
